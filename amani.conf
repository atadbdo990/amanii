# ══════════════════════════════════════════════════════════════
#  Amani — identity
#  Everything about naming lives here. Never touch install.sh.
# ══════════════════════════════════════════════════════════════
BRAND_NAME="Amani"
BRAND_HANDLE="@amona_mora"
BRAND_CHANNEL="https://t.me/amona_mora"

# ── SAFE: never appears on the network ─────────────────────────
BRAND_FRAGMENT="Amani"          # ← connection name shown in v2rayNG/StrongVPN
BRAND_TAG="amani-in"            # ← Xray inbound tag (your logs only)
BRAND_SERVICE_PREFIX="amani"    # ← Cloud Run service name prefix

# ── RISKY: visible on the wire ─────────────────────────────────
BRAND_PATH="/amani"             # ← used only in MODE=brand

# ── Mode: stealth (recommended) | brand ────────────────────────
MODE="${MODE:-stealth}"

# ── Cost limits ────────────────────────────────────────────────
MEMORY=512
CPU=1
MIN_INSTANCES=0
MAX_INSTANCES=1
CONCURRENCY=80
TIMEOUT=900
XRAY_VERSION=25.3.6

# ── Credential ─────────────────────────────────────────────────
# Leave empty to auto-generate (REQUIRED if you distribute this).
# Set it only for servers you run yourself.
PASSWORD="${PASSWORD:-}"
